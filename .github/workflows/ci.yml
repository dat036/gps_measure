name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with architecture.md §14.
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
          flutter pub get

      - name: Generate code
        # --force-jit: a dependency uses build hooks, which the default AOT
        # build script compilation does not support.
        run: |
          flutter gen-l10n
          dart run build_runner build --force-jit

      - name: Check formatting
        run: |
          git ls-files 'lib/*.dart' 'test/*.dart' \
            | grep -vE '\.(g|freezed)\.dart$|^lib/l10n/gen/' \
            | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Domain layer must stay pure Dart
        run: |
          if grep -rnE "package:(flutter|flutter_riverpod|riverpod|drift)|dart:ui" lib/domain; then
            echo "lib/domain must not import Flutter, Riverpod or Drift (architecture.md §2)."
            exit 1
          fi

      - name: Test
        # Goldens are rendered on the developer OS; they are checked locally.
        run: flutter test --exclude-tags golden --coverage

      - name: Domain coverage ≥ 90%
        run: python3 tool/coverage_report.py

      - name: Build dev APK
        run: |
          cp env/example.json env/dev.json
          # Placeholder config supports compilation only; no production Firebase access.
          cp android/app/google-services.example.json android/app/google-services.json
          flutter build apk --debug --flavor dev --dart-define-from-file=env/dev.json

      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
