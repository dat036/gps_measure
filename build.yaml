targets:
  $default:
    builders:
      drift_dev:
        options:
          # ISO-8601 text keeps milliseconds and the UTC offset (the default
          # unix-seconds integer would drop sub-second GPS timestamps).
          store_date_time_values_as_text: true
          databases:
            app: lib/data/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
