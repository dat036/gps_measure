name: gps_measurement
description: "LandMeasure — measure land area, distance and walk tracks with GPS."
publish_to: 'none'

version: 1.0.1+6

environment:
  sdk: ^3.10.4

dependencies:
  app_tracking_transparency: ^2.0.7
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  csv: ^8.0.0
  device_info_plus: ^13.2.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  facebook_app_events: ^0.30.5
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_remote_config: ^6.7.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.1.0
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  gma_mediation_meta: ^1.7.0
  go_router: ^17.5.0
  google_maps_flutter: ^2.18.1
  google_mobile_ads: ^9.1.0
  image_picker: ^1.2.3
  in_app_review: ^2.0.12
  intl: ^0.20.2
  json_annotation: ^4.9.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  permission_handler: 12.0.1
  riverpod_annotation: ^4.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  wakelock_plus: ^1.6.1
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.0+1
  sqlite3: 2.9.4
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/map_styles/
    - assets/images/
    - assets/icon/splash_logo.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0F8A5F"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter_native_splash:
  color: "#0F8A5F"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0F8A5F"
    image: assets/icon/splash_logo_android12.png
  web: false
